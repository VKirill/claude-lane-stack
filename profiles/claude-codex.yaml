# Claude + Codex only (no Grok). Emergency writer defaults to GPT-6 Luna.
# Agent names are **roles**. Daytime write still goes through run-supervisor +
# durable codex process (lane-writer), not emergency-writer.
pm: claude # Fable/Opus in dev-orchestrator frontmatter
profile: claude-codex
lanes:
  fast_write:
    agent: run-supervisor   # process provider=codex
    model: gpt-5.6-luna
    reasoning: max
  main_write:
    agent: run-supervisor   # process provider=codex
    model: gpt-5.6-luna
    reasoning: max
  review:
    agent: night-reviewer
    model: gpt-5.6-sol
    reasoning: high
  onboard:
    agent: project-onboarder
    model: gpt-5.6-terra
    reasoning: high
  docs_maintain:
    agent: docs-maintainer
    model: gpt-5.6-terra
    reasoning: high
  emergency_write:
    agent: emergency-writer
    model: gpt-6-luna
    reasoning: high
    service_tier: fast
notes:
  - "Daytime coder = durable codex process via run-controller, not a Claude subagent brand"
  - "Emergency writer is configured independently in adoc; default Luna/high/Fast"
  - "Prefer role agent names; see agents/claude/README.md for deprecated aliases"
