# Codex lane-writer — durable conveyor sessions (provider=codex).
#
# Loaded from an ephemeral CODEX_HOME: auth.json + this config + empty
# skills/ plugins/ rules/. Host ~/.codex is tmpfs-masked (no user skills,
# no plugins, no extra MCP servers).
#
# Runtime injects stdio MCP: gitnexus + agentmemory only (code graph +
# recall). Model/effort still come from lane-session / adoc (default Luna+max).
#
# Craft is `agents/grok/writer.md` in the prompt, not this file.

model = "gpt-5.6-luna"
model_reasoning_effort = "max"
# service_tier / fast_mode: lane-session from adoc writer.service_tier.
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "disabled"
personality = "pragmatic"
suppress_unstable_features_warning = true
project_doc_max_bytes = 32768
project_doc_fallback_filenames = ["AGENTS.md", "CLAUDE.md"]

[sandbox_workspace_write]
network_access = true

[agents]
max_threads = 1
max_depth = 1

# Keep shell/exec. Strip multi-agent, plugins, ChatGPT apps, browser, skills catalog.
[features]
multi_agent = false
multi_agent_v2 = false
plugins = false
plugin_sharing = false
remote_plugin = false
memories = false
apps = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
in_app_browser = false
computer_use = false
image_generation = false
goals = false
hooks = false
skill_search = false
skill_mcp_dependency_install = false
tool_suggest = false
tool_call_mcp_elicitation = false
mentions_v2 = false
shell_snapshot = false
workspace_dependencies = false
guardian_approval = false
