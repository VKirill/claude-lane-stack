name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LANE_INSTALL_CLAUDE_PLUGIN: "0"
      LANE_INSTALL_CODEX_PLUGIN: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap rsync ripgrep
          # Ubuntu hosted runners restrict unprivileged uid maps. Bubblewrap's
          # supported setuid mode keeps the tests unprivileged while allowing
          # their real namespace boundary to run in this ephemeral VM.
          sudo chmod u+s "$(command -v bwrap)"
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc \
            --tmpfs /tmp -- /bin/true
          python3 -m pip install --disable-pip-version-check \
            PyYAML==6.0.3 \
            jsonschema==4.26.0
      - name: Compile hooks and doctor
        run: |
          python3 -m py_compile hooks/*.py
          while IFS= read -r -d '' file; do
            [[ "$file" == hooks/* ]] && continue
            [[ "$(head -n 1 "$file")" == '#!/usr/bin/env python3' ]] || continue
            python3 -m py_compile "$file"
          done < <(find hooks bin -maxdepth 1 -type f -print0)
          python3 bin/agents-doctor --help
      - name: Shell scripts syntax
        if: always()
        run: |
          bash -n install.sh
          while IFS= read -r -d '' file; do
            [[ "$(head -n 1 "$file")" == '#!/usr/bin/env bash' ]] || continue
            bash -n "$file"
          done < <(find bin -maxdepth 1 -type f -print0)
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Board Node tests
        if: always()
        run: node --test board/server/lib/*.test.mjs board/web/js/*.test.mjs
      - name: Codex plugin tests
        if: always()
        run: python3 -m unittest discover -s plugins/codex-lane/tests -v
