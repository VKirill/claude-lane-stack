id: passport-onboard
title: Passport / ANAMNESIS onboard
phase: passport
status: active
version: "1.0.0"
summary: "Live or greenfield onboard → ANAMNESIS passport via Collector+Validator path."
depends_on: [core-harness]
soft_depends_on: [services-data, site-scan]
provides: [passport.anamnesis, passport.brief]
requires_provides: []
skills: [seo-prompt-engineering-2026, seo-drmax-orchestrator]
originals:
  - "book-v1.5-prompts/БОНУСЫ/Universal Project Data Collector v2.txt"
  - "book-v1.5-prompts/БОНУСЫ/Project Data Validator & Normalizer.txt"
cli: [seo-onboard]
artifacts:
  writes:
    - ".agents/seo/<slug>/ANAMNESIS.md"
    - ".agents/seo/<slug>/passport/**"
  reads:
    - ".agents/seo/<slug>/scans/**"
env: []
agent_triggers: ["онбординг", "паспорт проекта", "анамнез", "новый проект seo"]
entrypoints:
  agent: "seo-onboard live|greenfield; then Collector+Validator originals"
  cli: "seo-onboard live --slug <s> --url https://…"
scenarios: [live-site.yaml, greenfield.yaml, validate-passport.yaml]
